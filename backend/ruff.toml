# backend/ruff.toml

# Target Python 3.12
target-version = "py312"

# Maximum line length (88 is Black's default, widely adopted)
line-length = 88

[lint]
# Enable these rule sets:
# E/W = pycodestyle errors/warnings
# F   = pyflakes (unused imports, undefined names)
# I   = isort (import ordering)
select = ["E", "W", "F", "I"]

# Ignore these specific rules:
ignore = [
  "E501",  # Line too long — we handle this with line-length above
]

# Don't lint migrations — Django auto-generates these and they're messy
exclude = ["*/migrations/*"]