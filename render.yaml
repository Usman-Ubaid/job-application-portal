services:
  - type: web
    name: jobportal-backend      
    runtime: python
    rootDir: backend             
    buildCommand: poetry install --no-interaction && poetry run python manage.py collectstatic --no-input
    startCommand: poetry run gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
           
    envVars:
      - key: SECRET_KEY
        generateValue: true      
      - key: DEBUG
        value: "False"           
      - key: DATABASE_URL
        fromDatabase:
          name: jobportal-db     
          property: connectionString

databases:
  - name: jobportal-db
    databaseName: jobportal
    user: jobportal              
    plan: free